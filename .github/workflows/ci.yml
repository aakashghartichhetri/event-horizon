name: Build, test and container

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.compiler }} / ${{ matrix.configuration }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install headers and build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libboost1.83-dev
      - name: Configure
        env:
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_SUPPRESS_REGENERATION=ON -DEH_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j 2
      - name: Test including local HTTP integration
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libboost1.83-dev clang
      - name: Build with Clang AddressSanitizer and UBSan
        run: CXX=clang++ cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SUPPRESS_REGENERATION=ON -DEH_ENABLE_SANITIZERS=ON -DEH_WARNINGS_AS_ERRORS=ON && cmake --build build-san -j 2
      - name: Sanitized tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libboost1.83-dev
      - name: Build with GCC ThreadSanitizer
        # Boost.Asio emits -Wtsan on std::atomic_thread_fence with GCC 14.
        # Keep -Werror for normal builds, but do not promote that tool warning here.
        run: CXX=g++ cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SUPPRESS_REGENERATION=ON -DEH_ENABLE_THREAD_SANITIZER=ON -DEH_WARNINGS_AS_ERRORS=OFF && cmake --build build-tsan -j 2
      - name: Run race detection (engine and concurrent HTTP checks)
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check dashboard JavaScript and calculations
        run: node --version && node --check web/app.js && node --test web/insights.test.mjs

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Clang static analyzer on the simulation core
        run: |
          clang++ --version
          for file in src/exchange.cpp src/replay.cpp src/report.cpp src/resilience.cpp; do
            clang++ --analyze -std=c++20 -Iinclude -o /dev/null "$file"
          done

  google-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y ninja-build cmake libboost1.83-dev git
      - name: Fetch pinned GoogleTest and run additional cases
        run: cmake -S . -B build-gtest -G Ninja -DEH_WITH_GTEST=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_SUPPRESS_REGENERATION=ON && cmake --build build-gtest -j 2 && ctest --test-dir build-gtest --output-on-failure

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build portable container
        run: docker build --tag event-horizon:ci .
      - name: Start container and smoke-test API
        run: |
          docker run --detach --name event-horizon-smoke -p 127.0.0.1:8092:8080 event-horizon:ci
          python3 - <<'PYTEST'
          import json, time, urllib.request
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8092/api/health', timeout=2) as response:
                      assert json.load(response)['status'] == 'ok'
                  with urllib.request.urlopen('http://127.0.0.1:8092/insights.mjs', timeout=2) as response:
                      assert response.status == 200
                  with urllib.request.urlopen('http://127.0.0.1:8092/api/resilience', timeout=2) as response:
                      assert len(json.load(response)['cases']) == 12
                  print('Container API, resilience experiments and dashboard module ready')
                  break
              except Exception:
                  if attempt == 39: raise
                  time.sleep(0.5)
          PYTEST
